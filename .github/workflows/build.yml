name: Build WedCraft Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Create Flutter Project Structure
        run: |
          rm -rf lib pubspec.yaml
          flutter create . --platforms=android --org=com.wedcraft.app --project-name=wedcraft
          
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const WedCraftApp());
          }

          class WedCraftApp extends StatelessWidget {
            const WedCraftApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'WedCraft Studio',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF800020),
                    brightness: Brightness.dark,
                  ),
                ),
                home: const MainHomeScreen(),
              );
            }
          }

          class MainHomeScreen extends StatelessWidget {
            const MainHomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('WedCraft Design Studio', style: TextStyle(fontWeight: FontWeight.bold)),
                  centerTitle: true,
                  backgroundColor: const Color(0xFF800020),
                  elevation: 4,
                ),
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [Color(0xFF1A0006), Color(0xFF050002)],
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                    ),
                  ),
                  child: Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text(
                          "Choose Design Tool",
                          style: TextStyle(color: Colors.amber, fontSize: 18, fontWeight: FontWeight.bold),
                        ),
                        const SizedBox(height: 15),
                        Expanded(
                          child: GridView.count(
                            crossAxisCount: 2,
                            crossAxisSpacing: 14,
                            mainAxisSpacing: 14,
                            children: [
                              _buildToolCard(
                                context,
                                title: "Wedding Card",
                                subtitle: "Interactive Design",
                                icon: Icons.card_giftcard,
                                color: const Color(0xFF800020),
                                onTap: () => Navigator.push(
                                  context,
                                  MaterialPageRoute(builder: (_) => const CardEditorScreen()),
                                ),
                              ),
                              _buildToolCard(
                                context,
                                title: "Reels Generator",
                                subtitle: "Short Invitations",
                                icon: Icons.video_collection_rounded,
                                color: Colors.purple.shade900,
                                onTap: () => _showComingSoon(context, "Reels Generator"),
                              ),
                              _buildToolCard(
                                context,
                                title: "Status Maker",
                                subtitle: "WhatsApp & Insta",
                                icon: Icons.camera_alt_rounded,
                                color: Colors.deepOrange.shade900,
                                onTap: () => _showComingSoon(context, "Status Maker"),
                              ),
                              _buildToolCard(
                                context,
                                title: "Shayari & Quotes",
                                subtitle: "Hindi & English",
                                icon: Icons.format_quote_rounded,
                                color: Colors.teal.shade900,
                                onTap: () => _showComingSoon(context, "Shayari & Quotes"),
                              ),
                            ],
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildToolCard(
              BuildContext context, {
              required String title,
              required String subtitle,
              required IconData icon,
              required Color color,
              required VoidCallback onTap,
            }) {
              return GestureDetector(
                onTap: onTap,
                child: Container(
                  decoration: BoxDecoration(
                    color: color.withOpacity(0.4),
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(color: Colors.amber.withOpacity(0.6), width: 1.5),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withOpacity(0.3),
                        blurRadius: 8,
                        offset: const Offset(0, 4),
                      )
                    ],
                  ),
                  child: Padding(
                    padding: const EdgeInsets.all(12.0),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        CircleAvatar(
                          radius: 28,
                          backgroundColor: Colors.black38,
                          child: Icon(icon, size: 30, color: Colors.amber),
                        ),
                        const SizedBox(height: 12),
                        Text(
                          title,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white),
                        ),
                        const SizedBox(height: 4),
                        Text(
                          subtitle,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 11, color: Colors.white60),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _showComingSoon(BuildContext context, String feature) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('$feature Tool will be available in the next release!'),
                  backgroundColor: Colors.amber.shade900,
                ),
              );
            }
          }

          class CardEditorScreen extends StatefulWidget {
            const CardEditorScreen({super.key});

            @override
            State<CardEditorScreen> createState() => _CardEditorScreenState();
          }

          class _CardEditorScreenState extends State<CardEditorScreen> {
            final TextEditingController groomController = TextEditingController(text: "Rahul");
            final TextEditingController brideController = TextEditingController(text: "Priya");
            final TextEditingController dateController = TextEditingController(text: "25 DECEMBER 2026");

            Color cardBgColor = const Color(0xFF2C0003);
            Offset textOffset = const Offset(40, 130);

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Design Wedding Card'),
                  backgroundColor: const Color(0xFF800020),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.file_download, color: Colors.amber),
                      onPressed: () {
                        ScaffoldMessenger.of(context).showSnackBar(
                          const SnackBar(
                            content: Text('Invitation Card Saved to Gallery!'),
                            backgroundColor: Colors.green,
                          ),
                        );
                      },
                    )
                  ],
                ),
                body: SingleChildScrollView(
                  child: Column(
                    children: [
                      const SizedBox(height: 15),
                      const Text(
                        "Drag names to adjust placement",
                        style: TextStyle(color: Colors.amber, fontSize: 12),
                      ),
                      const SizedBox(height: 10),
                      Center(
                        child: Container(
                          width: 300,
                          height: 400,
                          decoration: BoxDecoration(
                            color: cardBgColor,
                            borderRadius: BorderRadius.circular(20),
                            border: Border.all(color: const Color(0xFFD4AF37), width: 3),
                            boxShadow: const [
                              BoxShadow(color: Colors.black54, blurRadius: 10, spreadRadius: 2)
                            ],
                          ),
                          child: Stack(
                            children: [
                              const Positioned(
                                top: 25,
                                left: 0,
                                right: 0,
                                child: Column(
                                  children: [
                                    Icon(Icons.favorite, color: Color(0xFFD4AF37), size: 24),
                                    SizedBox(height: 5),
                                    Text(
                                      "WEDDING INVITATION",
                                      textAlign: TextAlign.center,
                                      style: TextStyle(
                                        color: Color(0xFFD4AF37),
                                        fontSize: 12,
                                        letterSpacing: 3,
                                        fontWeight: FontWeight.bold,
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                              Positioned(
                                left: textOffset.dx,
                                top: textOffset.dy,
                                child: GestureDetector(
                                  onPanUpdate: (details) {
                                    setState(() {
                                      textOffset += details.delta;
                                    });
                                  },
                                  child: Column(
                                    children: [
                                      Text(
                                        groomController.text,
                                        style: const TextStyle(
                                          color: Colors.white,
                                          fontSize: 30,
                                          fontWeight: FontWeight.bold,
                                          fontFamily: 'Serif',
                                        ),
                                      ),
                                      const Text(
                                        "weds",
                                        style: TextStyle(color: Color(0xFFD4AF37), fontSize: 18, fontStyle: FontStyle.italic),
                                      ),
                                      Text(
                                        brideController.text,
                                        style: const TextStyle(
                                          color: Colors.white,
                                          fontSize: 30,
                                          fontWeight: FontWeight.bold,
                                          fontFamily: 'Serif',
                                        ),
                                      ),
                                      const SizedBox(height: 12),
                                      Text(
                                        dateController.text,
                                        style: const TextStyle(color: Colors.white70, fontSize: 12, letterSpacing: 1),
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),
                      Container(
                        padding: const EdgeInsets.all(18),
                        decoration: const BoxDecoration(
                          color: Color(0xFF141414),
                          borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text("Customization Controls", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                            const SizedBox(height: 12),
                            Row(
                              children: [
                                Expanded(
                                  child: TextField(
                                    controller: groomController,
                                    decoration: const InputDecoration(
                                      labelText: "Groom's Name",
                                      border: OutlineInputBorder(),
                                    ),
                                    onChanged: (val) => setState(() {}),
                                  ),
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: TextField(
                                    controller: brideController,
                                    decoration: const InputDecoration(
                                      labelText: "Bride's Name",
                                      border: OutlineInputBorder(),
                                    ),
                                    onChanged: (val) => setState(() {}),
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: dateController,
                              decoration: const InputDecoration(
                                labelText: "Date & Venue",
                                border: OutlineInputBorder(),
                              ),
                              onChanged: (val) => setState(() {}),
                            ),
                            const SizedBox(height: 15),
                            const Text("Background Theme Color", style: TextStyle(fontSize: 13, color: Colors.grey)),
                            const SizedBox(height: 8),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                              children: [
                                _buildColorBtn("Maroon", const Color(0xFF2C0003)),
                                _buildColorBtn("Emerald", const Color(0xFF002C1E)),
                                _buildColorBtn("Royal Purple", const Color(0xFF1E002C)),
                                _buildColorBtn("Classic Dark", const Color(0xFF121212)),
                              ],
                            )
                          ],
                        ),
                      )
                    ],
                  ),
                ),
              );
            }

            Widget _buildColorBtn(String title, Color color) {
              return ElevatedButton(
                style: ElevatedButton.styleFrom(
                  backgroundColor: color,
                  side: const BorderSide(color: Colors.amber, width: 1),
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                ),
                onPressed: () => setState(() => cardBgColor = color),
                child: Text(title, style: const TextStyle(fontSize: 11, color: Colors.white)),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedcraft-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
